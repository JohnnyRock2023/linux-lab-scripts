name: Build Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash script syntax
        run: |
          for sh in *.sh; do
            echo "Checking script $sh"
            bash -n "$sh"
          done

      - name: ShellCheck
        run: shellcheck --exclude=SC1091 count_files.sh

      - name: Run script
        run: |
          chmod +x count_files.sh
          ./count_files.sh

  build-rpm:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "fedora:40",     name: fedora40 }
          - { image: "fedora:41",     name: fedora41 }
          - { image: "fedora:latest", name: fedoralatest }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache dnf packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/dnf
            /var/cache/libdnf5
          key: dnf-${{ matrix.image }}-${{ hashFiles('packaging/rpm/*.spec') }}
          restore-keys: |
            dnf-${{ matrix.image }}-

      - name: Install build tools
        run: |
          dnf install -y --setopt=keepcache=1 rpm-build rpmdevtools

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Prepare sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES/count-files-2.0
          cp count_files.sh ~/rpmbuild/SOURCES/count-files-2.0/
          cp count_files.conf ~/rpmbuild/SOURCES/count-files-2.0/
          cp packaging/rpm/count_files.1 ~/rpmbuild/SOURCES/count-files-2.0/
          cd ~/rpmbuild/SOURCES
          tar czvf count-files-2.0.tar.gz count-files-2.0

      - name: Copy spec file
        run: cp packaging/rpm/count-files.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/count-files.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.name  }}
          path: ~/rpmbuild/RPMS/noarch/*.rpm

  build-deb:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Create apt cache directory
        run: mkdir -p $HOME/apt-cache

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-${{ hashFiles('packaging/deb/debian/control') }}
          restore-keys: |
            apt-${{ matrix.os }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=$HOME/apt-cache \
            build-essential debhelper devscripts

      - name: Prepare build directory
        run: |
          mkdir -p build/count-files-2.0
          cp count_files.sh build/count-files-2.0/
          cp count_files.conf build/count-files-2.0/
          cp -r packaging/deb/debian build/count-files-2.0/

      - name: Build DEB
        run: |
          cd build/count-files-2.0
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: build/*.deb

  release:
    needs: [ build-rpm, build-deb ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: distribution
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            distribution/*.rpm
            distribution/*.deb
          generate_release_notes: true
